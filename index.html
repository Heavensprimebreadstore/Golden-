<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heaven's Prime | Premium Bakery Marketplace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --hp-gold: #D4AF37; --hp-cream: #FFFDD0; --hp-choco: #3E2723; }
        body { background: var(--hp-cream); font-family: 'Segoe UI', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        /* Instant Pop Animation */
        .pop-in { animation: pop 0.3s ease-out forwards; }
        @keyframes pop { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        #sidebar { transition: 0.3s ease-in-out; z-index: 1000; }
        .hidden-panel { display: none !important; }
    </style>
</head>
<body class="text-stone-900">

    <!-- INSTANT SPLASH (Fades in 0.5s) -->
    <div id="splash" class="fixed inset-0 bg-white z-[9999] flex flex-col justify-center items-center">
        <div class="w-12 h-12 border-4 border-stone-200 border-t-orange-500 rounded-full animate-spin"></div>
        <h1 class="mt-4 font-black text-xl tracking-widest text-orange-600">HEAVEN'S PRIME</h1>
    </div>

    <!-- JUMIA-STYLE SIDEBAR -->
    <div id="sidebar" class="fixed inset-y-0 left-0 w-72 bg-white shadow-2xl -translate-x-full overflow-y-auto">
        <div class="p-6 bg-stone-900 text-white">
            <h2 class="text-xl font-bold">Menu</h2>
            <p class="text-xs text-stone-400">Freshness You Can Trust</p>
        </div>
        <nav class="p-4 space-y-2">
            <button onclick="showSection('home')" class="w-full text-left p-3 hover:bg-orange-50 rounded-lg flex items-center gap-3 font-bold"><i class="fas fa-home"></i> Home</button>
            <button onclick="toggleLogin()" class="w-full text-left p-3 hover:bg-orange-50 rounded-lg flex items-center gap-3 font-bold"><i class="fas fa-user"></i> Customer Login</button>
            <button onclick="showSection('complaints')" class="w-full text-left p-3 hover:bg-orange-50 rounded-lg flex items-center gap-3 font-bold text-red-600"><i class="fas fa-exclamation-circle"></i> Complaints Portal</button>
            <button onclick="enterAdmin()" class="w-full text-left p-3 hover:bg-orange-50 rounded-lg flex items-center gap-3 font-bold text-orange-600 border-t mt-4"><i class="fas fa-lock"></i> Admin Dashboard</button>
        </nav>
    </div>

    <!-- MAIN HEADER -->
    <header class="sticky top-0 bg-white shadow-md z-50 px-4 py-3 flex items-center gap-4">
        <button onclick="toggleSidebar()"><i class="fas fa-bars text-2xl"></i></button>
        <div class="flex-1 relative">
            <i class="fas fa-search absolute left-3 top-3 text-stone-400"></i>
            <input type="text" id="mainSearch" onkeyup="instantSearch()" placeholder="Search bread, snacks..." class="w-full bg-stone-100 rounded-full py-2 px-10 focus:ring-2 focus:ring-orange-500 transition-all">
        </div>
        <div class="relative" onclick="showSection('cart')">
            <i class="fas fa-shopping-basket text-2xl"></i>
            <span id="cart-count" class="absolute -top-2 -right-2 bg-orange-600 text-white text-[10px] w-5 h-5 rounded-full flex items-center justify-center font-bold">0</span>
        </div>
    </header>

    <!-- CONTENT SECTIONS -->
    <main id="app-content" class="p-4 space-y-8">
        <!-- PROMO VIDEO AREA -->
        <div class="rounded-2xl overflow-hidden shadow-lg bg-black h-48 relative">
            <video autoplay muted loop class="w-full h-full object-cover opacity-70">
                <source src="your-promo.mp4" type="video/mp4">
            </video>
            <div class="absolute inset-0 flex flex-col justify-center items-center text-white">
                <h3 class="font-bold">HEAVEN'S PRIME ADVERT</h3>
                <p class="text-xs">Supplying Homes & Supermarkets</p>
            </div>
        </div>

        <!-- HORIZONTAL CATEGORIES -->
        <div>
            <h3 class="font-bold mb-3">Categories</h3>
            <div class="flex gap-4 overflow-x-auto no-scrollbar pb-2" id="categoryList">
                <!-- Categories dynamically loaded -->
            </div>
        </div>

        <!-- INSTANT PRODUCT GRID -->
        <div>
            <h3 class="font-bold mb-3">Today's Fresh Stock</h3>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4" id="productGrid">
                <!-- Products pop up here -->
            </div>
        </div>

        <!-- TESTIMONIALS -->
        <div class="bg-white p-6 rounded-2xl shadow-sm italic text-stone-600">
            <h3 class="font-bold not-italic mb-4 text-stone-900">What Ikorodu Says</h3>
            <div id="testimonialSlider">
                "The Sardine bread is literally the best in Odogunyan! Fast delivery too." - *Mrs. Adeola*
            </div>
        </div>
    </main>

    <!-- ADMIN PANEL (Hidden by Default) -->
    <div id="admin-panel" class="hidden-panel fixed inset-0 bg-white z-[2000] p-6 overflow-y-auto">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-black">Admin Command Center</h2>
            <button onclick="hideSection('admin-panel')" class="text-2xl">&times;</button>
        </div>
        <div class="space-y-4">
            <input type="text" id="newPName" placeholder="Bread Name" class="w-full p-3 border rounded">
            <div class="grid grid-cols-2 gap-4">
                <input type="number" id="newPRetail" placeholder="Retail (₦)" class="w-full p-3 border rounded">
                <input type="number" id="newPWhole" placeholder="Wholesale (₦)" class="w-full p-3 border rounded">
            </div>
            <input type="text" id="newPImg" placeholder="Image URL (Unsplash or Firebase)" class="w-full p-3 border rounded">
            <button onclick="addProduct()" class="w-full bg-stone-900 text-white py-4 rounded-xl font-bold">UPLOAD PRODUCT INSTANTLY</button>
            <hr class="my-6">
            <div id="adminList" class="space-y-2">
                <!-- Editable list here -->
            </div>
        </div>
    </div>

    <!-- COMPLAINTS PORTAL -->
    <div id="complaints-panel" class="hidden-panel fixed inset-0 bg-white z-[2000] p-6">
        <h2 class="text-2xl font-bold mb-4">Customer Support</h2>
        <textarea id="complaintMsg" placeholder="Tell us what went wrong..." class="w-full h-48 p-4 border rounded-xl mb-4"></textarea>
        <button onclick="sendComplaint()" class="w-full bg-red-600 text-white py-4 rounded-xl font-bold">SUBMIT TO HEAVEN'S PRIME</button>
    </div>

    <script>
        // CORE STATE (Persists in LocalStorage for weak network speed)
        let products = JSON.parse(localStorage.getItem('hp_stock')) || [
            { id: 1, name: "Premium Butter Bread", retail: 1200, wholesale: 1000, img: "https://images.unsplash.com/photo-1509440159596-0249088772ff?w=400", cat: "Butter" }
        ];
        let cart = [];

        // 1. INSTANT LOAD SYSTEM
        window.onload = () => {
            renderUI();
            setTimeout(() => {
                document.getElementById('splash').style.opacity = '0';
                setTimeout(() => document.getElementById('splash').style.display = 'none', 300);
            }, 500); // 0.5s splash as requested
        };

        // 2. RENDER ENGINE
        function renderUI() {
            const grid = document.getElementById('productGrid');
            const adminList = document.getElementById('adminList');
            grid.innerHTML = "";
            adminList.innerHTML = "";

            products.forEach((p, idx) => {
                // Customer View
                grid.innerHTML += `
                    <div class="pop-in bg-white p-3 rounded-2xl shadow-sm border border-stone-100">
                        <img src="${p.img}" class="w-full h-32 object-cover rounded-xl mb-2">
                        <h4 class="font-bold text-sm truncate">${p.name}</h4>
                        <div class="flex justify-between items-center">
                            <span class="text-orange-600 font-bold">₦${p.retail}</span>
                            <button onclick="addToCart(${p.id})" class="bg-stone-900 text-white w-8 h-8 rounded-full">+</button>
                        </div>
                    </div>`;
                
                // Admin Edit List
                adminList.innerHTML += `
                    <div class="flex justify-between items-center bg-stone-50 p-3 rounded-lg border">
                        <span>${p.name} (₦${p.retail})</span>
                        <div class="flex gap-2">
                            <button onclick="deleteProduct(${idx})" class="text-red-500"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>`;
            });
        }

        // 3. ADMIN ACTIONS
        function addProduct() {
            const name = document.getElementById('newPName').value;
            const retail = document.getElementById('newPRetail').value;
            const whole = document.getElementById('newPWhole').value;
            const img = document.getElementById('newPImg').value;
            
            if(!name || !retail) return alert("Fill Name and Price!");

            products.unshift({ id: Date.now(), name, retail, wholesale: whole, img: img || 'https://via.placeholder.com/150', cat: 'General' });
            localStorage.setItem('hp_stock', JSON.stringify(products));
            renderUI();
            hideSection('admin-panel');
        }

        function deleteProduct(idx) {
            products.splice(idx, 1);
            localStorage.setItem('hp_stock', JSON.stringify(products));
            renderUI();
        }

        // 4. SEARCH & NAVIGATION
        function instantSearch() {
            const query = document.getElementById('mainSearch').value.toLowerCase();
            const cards = document.querySelectorAll('.pop-in');
            cards.forEach(card => {
                card.style.display = card.innerText.toLowerCase().includes(query) ? "block" : "none";
            });
        }

        function toggleSidebar() { 
            const s = document.getElementById('sidebar');
            s.style.transform = s.style.transform === "translateX(0px)" ? "translateX(-100%)" : "translateX(0px)";
        }

        function showSection(id) { document.getElementById(id + '-panel').classList.remove('hidden-panel'); toggleSidebar(); }
        function hideSection(id) { document.getElementById(id).classList.add('hidden-panel'); }

        function enterAdmin() {
            const pin = prompt("Enter Heaven's Prime Admin Pin:");
            if(pin === "2006") showSection('admin');
            else alert("Unauthorized Access!");
        }

        // 5. CHECKOUT (08094222602)
        function checkout() {
            let msg = "🍞 *HEAVEN'S PRIME ORDER*%0A";
            cart.forEach(i => msg += `- ${i.name} x${i.qty}%0A`);
            window.open(`https://wa.me/2348094222602?text=${msg}`);
        }
    </script>
</body>
            </html>
