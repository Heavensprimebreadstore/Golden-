<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heavens Prime Bread store</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #f4f4f4;
}

/* HEADER */
header {
  background: linear-gradient(135deg, #8b0000, #b22222);
  color: white;
  text-align: center;
  padding: 20px;
}

.logoPreview {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background: white;
  margin: auto;
  margin-bottom: 10px;
  overflow: hidden;
}

.logoPreview img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* NAV */
nav {
  background: #222;
  text-align: center;
  padding: 10px;
}

nav a {
  color: white;
  margin: 10px;
  text-decoration: none;
}

/* HERO */
.hero {
  background: white;
  text-align: center;
  padding: 30px;
}

/* SECTIONS */
section {
  background: white;
  margin: 15px;
  padding: 15px;
  border-radius: 10px;
}

/* GRID */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 10px;
}

.card {
  background: #fff5f5;
  padding: 10px;
  border-radius: 10px;
  border-left: 4px solid #8b0000;
  text-align: center;
}

/* FORM */
input, select {
  width: 100%;
  padding: 10px;
  margin: 5px 0;
}

/* BUTTON */
button {
  width: 100%;
  padding: 12px;
  background: #8b0000;
  color: white;
  border: none;
  cursor: pointer;
}

/* FLOAT */
.whatsapp {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: #25d366;
  color: white;
  padding: 12px;
  border-radius: 50px;
  text-decoration: none;
}

/* ADMIN */
.adminBox {
  background: #111;
  color: white;
  padding: 10px;
  border-radius: 10px;
}
</style>
</head>

<body>

<header>
  <div class="logoPreview">
    <img id="logoImg" src="">
  </div>

  <h2>Heavens Prime Bread</h2>
  <p>Wholesale & Retail Distribution</p>

  <input type="file" onchange="loadLogo(event)" style="color:white">
</header>

<nav>
  <a href="#shop">Shop</a>
  <a href="#order">Order</a>
  <a href="#admin">Admin</a>
</nav>

<!-- HERO -->
<div class="hero">
  <h2>Fresh Bread • Fast Delivery • Trusted Supply</h2>
</div>

<!-- GALLERY -->
<section>
  <h3>Product Gallery</h3>
  <div class="grid">
    <div class="card">🍞 Loaf Bread</div>
    <div class="card">🥖 Sandwich Bread</div>
    <div class="card">📦 Wholesale Pack</div>
  </div>
</section>

<!-- ORDER -->
<section id="order">
  <h3>Place Order</h3>

  <input id="name" placeholder="Name">
  <input id="phone" placeholder="Phone">

  <select id="type" onchange="calcPrice()">
    <option value="Retail">Retail</option>
    <option value="Wholesale">Wholesale</option>
  </select>

  <input id="qty" type="number" placeholder="Quantity" oninput="calcPrice()">

  <select id="zone" onchange="calcPrice()">
    <option value="0">Select Delivery Zone</option>
    <option value="500">Ikorodu (+₦500)</option>
    <option value="1000">Mainland (+₦1000)</option>
    <option value="1500">Island (+₦1500)</option>
  </select>

  <h4 id="total">Total: ₦0</h4>

  <button onclick="sendOrder()">Order on WhatsApp</button>
</section>

<!-- ADMIN DASHBOARD -->
<section id="admin">
  <h3>Admin Dashboard</h3>

  <div class="adminBox">
    <p>Total Orders: <span id="orders">0</span></p>
    <p>Daily Sales: ₦<span id="sales">0</span></p>
    <button onclick="resetData()">Reset Data</button>
  </div>
</section>

<a class="whatsapp" href="https://wa.me/2348094222602">WhatsApp</a>

<script>
let retail = 1500;
let wholesale = 1200;

function calcPrice() {
  let type = document.getElementById("type").value;
  let qty = Number(document.getElementById("qty").value || 0);
  let zone = Number(document.getElementById("zone").value);

  let pricePer = type === "Wholesale" ? wholesale : retail;

  let total = (pricePer * qty) + zone;

  document.getElementById("total").innerText = "Total: ₦" + total;

  localStorage.setItem("lastTotal", total);
}

function sendOrder() {
  let name = document.getElementById("name").value;
  let phone = document.getElementById("phone").value;
  let type = document.getElementById("type").value;
  let qty = document.getElementById("qty").value;
  let total = localStorage.getItem("lastTotal") || 0;

  let msg =
`Order:
Name: ${name}
Phone: ${phone}
Type: ${type}
Qty: ${qty}
Total: ₦${total}`;

  let url = "https://wa.me/2348094222602?text=" + encodeURIComponent(msg);

  // save admin data
  let orders = Number(localStorage.getItem("orders") || 0);
  let sales = Number(localStorage.getItem("sales") || 0);

  localStorage.setItem("orders", orders + 1);
  localStorage.setItem("sales", sales + Number(total));

  updateAdmin();

  window.open(url, "_blank");
}

function updateAdmin() {
  document.getElementById("orders").innerText = localStorage.getItem("orders") || 0;
  document.getElementById("sales").innerText = localStorage.getItem("sales") || 0;
}

function resetData() {
  localStorage.clear();
  updateAdmin();
}

function loadLogo(event) {
  let img = document.getElementById("logoImg");
  img.src = URL.createObjectURL(event.target.files[0]);
}

updateAdmin();
</script>

</body>
  </html>
